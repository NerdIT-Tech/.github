name: Terraform lint & scan
description: >-
  Backend-less static analysis bundle for a Terraform root: fmt check,
  validate, tflint, and a Trivy IaC scan. Composes the fmt/init/validate/
  tflint actions in this same directory rather than duplicating their
  steps -- pull in just one of those instead of this whole bundle if a
  project only wants (say) tflint. The Trivy step calls
  aquasecurity/trivy-action directly rather than through a local wrapper,
  since it wasn't adding anything over the upstream action. Every check in
  this bundle (fmt, validate, tflint, Trivy) posts its findings as GitHub
  annotations (::error/::warning file=,line=,col=::) on failure, so issues
  show up inline on the PR's Files changed tab, the same way actionlint and
  yaml-lint do. No AWS credentials or state access required, so this is
  safe to run on untrusted PR branches. Requires the calling job to have
  already run actions/checkout -- like any local action, this one has to be
  resolvable on disk before it can run, so it can't check out the repo
  itself as its first step.

inputs:
  terraform-version:
    description: Terraform version to install (hashicorp/setup-terraform).
    required: true
  tflint-version:
    description: tflint version to install, or "latest".
    required: false
    default: latest
  trivy-severity:
    description: Comma-separated severities that fail the Trivy scan.
    required: false
    default: "CRITICAL,HIGH"
  trivy-version:
    description: aquasecurity/trivy-action version.
    required: false
    default: v0.72.0
  working-directory:
    description: Terraform root to lint/scan.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: ./.github/actions/terraform-fmt
      with:
        terraform-version: ${{ inputs.terraform-version }}
        working-directory: ${{ inputs.working-directory }}

    - uses: ./.github/actions/terraform-init
      with:
        terraform-version: ${{ inputs.terraform-version }}
        no-backend: "true"
        working-directory: ${{ inputs.working-directory }}

    - uses: ./.github/actions/terraform-validate
      with:
        terraform-version: ${{ inputs.terraform-version }}
        working-directory: ${{ inputs.working-directory }}

    - uses: ./.github/actions/tflint
      with:
        tflint-version: ${{ inputs.tflint-version }}
        working-directory: ${{ inputs.working-directory }}

    - name: Trivy IaC scan
      id: trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: ${{ inputs.working-directory }}
        exit-code: "1"
        severity: ${{ inputs.trivy-severity }}
        version: ${{ inputs.trivy-version }}
        format: json
        output: trivy-results.json

    - name: Annotate Trivy findings
      if: failure()
      shell: bash
      run: |
        jq -r '
          def esc: gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A");
          def escprop: esc | gsub(",";"%2C") | gsub(":";"%3A");
          (.Results // [])[] as $r |
          ($r.Target // "") as $target |
          ($r.Misconfigurations // [])[] |
          (if (.Severity == "CRITICAL" or .Severity == "HIGH") then "error" else "warning" end) as $level |
          ((.ID // "") + ": " + (.Title // .Message // "") + (if (.Message // "") != "" and (.Message // "") != (.Title // "") then " - " + .Message else "" end) | esc) as $msg |
          (.CauseMetadata.StartLine // 1) as $line |
          "::" + $level + " file=" + ($target|escprop) + ",line=" + ($line|tostring) + ",title=trivy::" + $msg
        ' trivy-results.json
