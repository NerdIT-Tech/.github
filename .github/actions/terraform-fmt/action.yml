name: Terraform fmt check
description: >-
  Fails if any .tf file isn't canonically formatted. Standalone and
  order-independent -- unlike validate, fmt doesn't need `terraform init`
  first. When check is true and the check fails, also posts a GitHub
  annotation (::error file=,line=,title=::) at each unformatted hunk so the
  issue shows up inline on the PR's Files changed tab, the same way
  actionlint and yaml-lint do. Requires the calling job to have already run
  actions/checkout.

inputs:
  terraform-version:
    description: Terraform version to install (hashicorp/setup-terraform).
    required: true
  check:
    description: Fail instead of writing changes back to disk (-check).
    required: false
    default: "true"
  recursive:
    description: Process subdirectories too (-recursive).
    required: false
    default: "true"
  diff:
    description: Print a diff of changes needed (-diff).
    required: false
    default: "true"
  working-directory:
    description: Terraform root to check.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: terraform fmt
      id: fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # env, not inline ${{ }}: Actions expands template syntax before the
      # script is written to disk, so the flag ternaries belong in the shell,
      # where the values are only ever literals this step itself produces.
      env:
        FMT_CHECK: ${{ inputs.check }}
        FMT_RECURSIVE: ${{ inputs.recursive }}
        FMT_DIFF: ${{ inputs.diff }}
      run: |
        set -euo pipefail
        args=()
        if [ "$FMT_CHECK" = "true" ]; then args+=(-check); fi
        if [ "$FMT_RECURSIVE" = "true" ]; then args+=(-recursive); fi
        if [ "$FMT_DIFF" = "true" ]; then args+=(-diff); fi
        terraform fmt "${args[@]}"

    - name: Annotate unformatted files
      if: failure() && inputs.check == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # env, not inline ${{ }}: the working directory is caller-supplied and
      # would otherwise be spliced straight into the generated script.
      env:
        FMT_RECURSIVE: ${{ inputs.recursive }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        wd="$WORKING_DIRECTORY"
        wd="${wd%/}"
        if [ "$wd" = "." ]; then prefix=""; else prefix="${wd#./}/"; fi

        args=()
        if [ "$FMT_RECURSIVE" = "true" ]; then args+=(-recursive); fi

        file=""
        while IFS= read -r diffline; do
          case "$diffline" in
            "--- "*|"+++ "*) ;;
            "@@"*)
              if [[ "$diffline" =~ \+([0-9]+) ]]; then
                echo "::error file=${prefix}${file},line=${BASH_REMATCH[1]},title=terraform fmt::This file is not formatted correctly. Run \`terraform fmt\` to fix."
              fi
              ;;
            " "*|"-"*|"+"*) ;;
            "") ;;
            *) file="$diffline" ;;
          esac
        done < <(terraform fmt -check "${args[@]}" -diff -no-color)
