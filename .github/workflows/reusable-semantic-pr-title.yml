# Release component: reusable-semantic-pr-title
# Pin from another repo as reusable-semantic-pr-title.yml@reusable-semantic-pr-title/v0.
name: Semantic PR Title

on:
  workflow_call:
    inputs:
      types:
        description: "The allowed commit types"
        required: false
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          chore
          build
          ci
      requireScope:
        description: "Whether a scope is required"
        required: false
        type: boolean
        default: true
      scopes:
        description: "The allowed commit scopes"
        required: false
        type: string
        default: ""
      subjectPattern:
        description: "The regex pattern for the subject"
        required: false
        type: string
        default: "^#[0-9]+.*$"
      exampleCommitTitle:
        description: "An example of a valid commit title"
        required: false
        type: string
        default: "feat(ci): #1234 add new feature"
      ignoreLabels:
        description: "Labels that exempt a pull request from title validation entirely (newline delimited)"
        required: false
        type: string
        default: "no-issue-required"

permissions: {}

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The action reads the current title through pulls.get, which needs
      # pull-requests: read, implied by write. contents: read is kept for
      # parity with reusable-lint-go.yml and the documented contract.
      contents: read
      pull-requests: write  # sticky PR title lint comment: create on failure, delete on success
      # statuses: write is intentionally absent. The action only writes a commit
      # status when its `wip` input is set, and this workflow does not set it.
    steps:
      # Reference the composite action with the self-repository `$/` prefix.
      # A reusable workflow's ./-relative `uses:` resolves against the CALLER's
      # checkout, not this repo, so `./.github/actions/
      # semantic-pull-request` breaks in every consumer (e.g. the failed 'Lint
      # PR title' check in devcontainer-features). `$/` targets this repo at
      # the running commit and ignores the caller's checkout, so it works from
      # inside a reusable workflow. The action itself only calls remote
      # actions, so no actions/checkout is required.
      - uses: $/.github/actions/semantic-pull-request
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.requireScope }}
          scopes: ${{ inputs.scopes }}
          subjectPattern: ${{ inputs.subjectPattern }}
          exampleCommitTitle: ${{ inputs.exampleCommitTitle }}
          ignoreLabels: ${{ inputs.ignoreLabels }}
