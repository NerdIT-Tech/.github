name: Test Go Code

on:
  workflow_call:
    inputs:
      os:
        description: "Operating system to run tests on (e.g. ubuntu-latest, macos-latest, windows-latest)"
        type: string
        default: "ubuntu-latest"
      go-version:
        description: "Go version to use (e.g. stable, oldstable, 1.20)"
        type: string
        default: "stable"
      go-build-flags:
        description: "Additional flags to pass to 'go build' (e.g. '-tags=integration')"
        type: string
        default: ""
      coverage-file:
        description: "Coverage file path (e.g. coverage.out). Set to empty to skip coverage."
        type: string
        default: "coverage.txt"
      package-path:
        description: "Path to the Go package to test"
        type: string
        default: "."
      tparse-version:
        description: "tparse release version to be installed (e.g. v0.13.3, or 'latest')"
        type: string
        default: "v0.18.0"
      working-directory:
        description: "Working directory to run tests in (e.g. '.', 'tests/integration/v2')"
        type: string
        default: "."
      env-vars:
        description: "Environment variables for the test run as KEY=VALUE lines, one per line. For non-secret settings; pass secrets through the secrets keyword."
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: "Codecov token used to upload coverage reports; empty skips authenticated upload"
        required: false

permissions: {}

jobs:
  test-go:
    name: Test Go Code
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    permissions:
      contents: read  # checkout and build
      pull-requests: write  # sticky PR comment on failure
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        # zizmor: ignore[cache-poisoning] -- test-go: setup-go saves caches only on default-branch refs; PR/fork runs only restore, so no fork-persisted cache reaches trusted runs
        with:
          go-version: ${{ inputs.go-version }}
      - name: Install tparse
        uses: NerdIT-Tech/.github/.github/actions/install-tparse@cc832ff8ab108890d3fdc4553be9d4b4265d8f06  # install-tparse/v0.1.0
        with:
          tparse-version: ${{ inputs.tparse-version }}
      - name: Configure environment
        if: inputs.env-vars != ''
        shell: bash
        # env, not inline ${{ }}: Actions expands template syntax before this
        # script is written to disk, so a newline in env-vars would splice in
        # extra commands, and the surviving lines then land in $GITHUB_ENV,
        # which applies to every later step. Read the value at runtime instead.
        env:
          ENV_VARS: ${{ inputs.env-vars }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            # $GITHUB_ENV entries are executable configuration for the rest of
            # the job, so only well-formed KEY=VALUE assignments get through;
            # anything else is rejected instead of being written blindly.
            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              # Escape before echoing: the offending line is caller-supplied and
              # a raw % or CR would otherwise truncate the annotation or forge
              # a following workflow command. Same order as the esc/escprop
              # helpers in terraform-validate.
              esc="${line//'%'/'%25'}"
              esc="${esc//$'\r'/'%0D'}"
              esc="${esc//$'\n'/'%0A'}"
              echo "::error::env-vars entry is not a KEY=VALUE assignment:${esc}"
              exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"
      - name: Run Tests
        id: test-run
        uses: NerdIT-Tech/.github/.github/actions/go-test@8f840b1d020b8c0b7900adeebd5132b93aa2313a  # go-test/v0.1.0
        with:
          format-json: true
          verbose: true
          coverage-profile: ${{ inputs.coverage-file }}
          build-flags: ${{ inputs.go-build-flags }}
          package-paths: ${{ inputs.package-path }}
          working-directory: ${{ inputs.working-directory }}
      - name: Post Sticky Comment
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: test-failure-summary
          message: "One or more tests failed on ${{ inputs.os }} with Go ${{ inputs.go-version }}. See the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

      - name: Delete Test Failure Comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: test-failure-summary
          delete: true

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && inputs.go-version == 'stable' && inputs.coverage-file != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ${{ inputs.coverage-file }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
