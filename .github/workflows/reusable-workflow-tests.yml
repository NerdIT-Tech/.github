# Release component: reusable-workflow-tests
# Pin from another repo as reusable-workflow-tests.yml@reusable-workflow-tests/v0.
name: Workflow Contract Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to run the tests under"
        type: string
        default: "3.x"
      test-path:
        description: "Path to the test suite"
        type: string
        default: ".github/tests"

permissions: {}

jobs:
  pytest:
    name: Run contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout the workflows being asserted on
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # test_release_surface.py reads the local tag list to assert every
          # released component has a floating <component>/v<major> tag. A
          # shallow clone has no tags, so the test skips in CI and the
          # contract goes unenforced.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "pytest==9.0.2" "PyYAML==6.0.3"

      - name: Run tests
        env:
          # Via the environment, not interpolated into the script: a caller
          # controls this string, and `${{ }}` in a `run:` block is a shell
          # injection.
          TEST_PATH: ${{ inputs.test-path }}
        run: python -m pytest "$TEST_PATH" -v
