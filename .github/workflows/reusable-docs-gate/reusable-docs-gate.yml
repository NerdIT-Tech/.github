name: Docs Quality Gate

# This workflow composes the two checks it used to inline as hand-maintained
# copies: `reusable-vale-lint.yml` and `reusable-check-snippets.yml`. Both jobs
# were byte-identical forks, so a fix to either had to be applied twice and
# would silently diverge on the next edit. The copies also hardcoded two Vale
# inputs, so a caller of this workflow could not make Vale non-blocking while a
# caller of `reusable-vale-lint` could.
#
# The two prefixed inputs are the fix for that: `vale-fail-on-error` and
# `vale-separator` are now caller-controlled, matching the `vale-` prefix the
# other Vale inputs here already use.
on:
  workflow_call:
    inputs:
      vale-files:
        description: "Comma-separated file/directory paths for Vale to lint"
        type: string
        default: ""
      vale-level:
        description: "Minimum Vale severity level"
        type: string
        default: "error"
      vale-version:
        description: "Vale CLI version"
        type: string
        default: "3.18.0"
      vale-separator:
        description: "Separator between Vale file paths"
        type: string
        default: ","
      vale-fail-on-error:
        description: "Fail this workflow on Vale lint errors"
        type: boolean
        default: true
      snippets-path:
        description: "Path to the Go snippets directory to vet"
        type: string
        default: ""
      snippets-dir:
        description: "Directory containing snippet files with [START x] / [END x] markers"
        type: string
        default: ""
      docs-dir:
        description: "Directory containing documentation pages that reference regions"
        type: string
        default: ""
      check-snippets:
        description: "Run the doc snippet contract checks"
        type: boolean
        default: true

permissions: {}

jobs:
  vale:
    name: Vale Lint (full site)
    # No `timeout-minutes` here: GitHub rejects it on a job that calls a
    # reusable workflow, so the bound is each callee's own job timeout
    # (10 minutes for both). A caller that needs a tighter overall bound gets
    # it by calling the two workflows directly instead of through this gate.
    uses: $/.github/workflows/reusable-vale-lint/reusable-vale-lint.yml
    permissions:
      contents: read  # checkout and Vale lint
    with:
      files: ${{ inputs.vale-files }}
      level: ${{ inputs.vale-level }}
      vale-version: ${{ inputs.vale-version }}
      separator: ${{ inputs.vale-separator }}
      fail-on-error: ${{ inputs.vale-fail-on-error }}

  snippets:
    name: Check Doc Snippets
    if: ${{ inputs.check-snippets }}
    uses: $/.github/workflows/reusable-check-snippets/reusable-check-snippets.yml
    permissions:
      contents: read
    with:
      snippets-path: ${{ inputs.snippets-path }}
      snippets-dir: ${{ inputs.snippets-dir }}
      docs-dir: ${{ inputs.docs-dir }}
