name: E2E Go Tests (deprecated)

# DEPRECATED. Superseded by reusable-bdd-go.yml, which is generic about the
# suite it runs and the target it authenticates against. This wrapper is
# kept so existing consumers keep working after they move to a newer tag.
#
# It preserves the old Go + ServiceNow defaults and translates the legacy
# `instance`/`username`/`password` secret names onto the `BDD_*` convention
# the harness reads. The translation is workflow-side only: a consumer whose
# *test code* reads SN_INSTANCE, SN_USERNAME, or SN_PASSWORD must be updated
# to read BDD_INSTANCE, BDD_USERNAME, and BDD_PASSWORD. That part cannot be
# hidden from behind a wrapper and is called out in the PR description.
#
# To migrate: point the `uses:` line at reusable-bdd-go.yml, delete
# `secrets: inherit`-irrelevant `secrets:` mapping, and rename the four
# repository secrets to the BDD_* names.

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        type: string
        default: "stable"
      test-timeout:
        description: "Timeout for the test run (e.g. '40m')"
        type: string
        default: "40m"
      working-directory:
        description: "Directory containing the test modules"
        type: string
        default: "tests/integration/v2"
      build-flags:
        description: "Additional go test flags (e.g. '-tags e2e')"
        type: string
        default: "-tags e2e"
    secrets:
      instance:
        description: "ServiceNow instance to run the E2E suite against"
        required: true
      username:
        description: "ServiceNow user with table API access"
        required: true
      password:
        description: "Password for the ServiceNow user"
        required: true

permissions: {}

jobs:
  e2e:
    name: Live Instance Tests
    permissions:
      contents: read  # checkout, build, and artifact upload
    uses: $/.github/workflows/reusable-bdd-go.yml
    with:
      go-version: ${{ inputs.go-version }}
      # The legacy build-flags and test-timeout inputs are folded back into
      # a single command here, since the harness exposes one suite-command
      # input rather than a driver matrix.
      suite-command: go test ${{ inputs.build-flags }} ./... -timeout ${{ inputs.test-timeout }} -v
      working-directory: ${{ inputs.working-directory }}
      report-pattern: "^(=== RUN|--- FAIL|FAIL|ok )"
      artifact-name: "e2e-output"
    secrets:
      BDD_INSTANCE: ${{ secrets.instance }}
      BDD_USERNAME: ${{ secrets.username }}
      BDD_PASSWORD: ${{ secrets.password }}
