name: E2E Go Tests

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        type: string
        default: "stable"
      test-timeout:
        description: "Timeout for the test run (e.g. '40m')"
        type: string
        default: "40m"
      working-directory:
        description: "Directory containing the test modules"
        type: string
        default: "tests/integration/v2"
      build-flags:
        description: "Additional go test flags (e.g. '-tags e2e')"
        type: string
        default: "-tags e2e"
    secrets:
      # SUPERSEDED, not removed, and not by anything this file can do. The e2e
      # job declares the 'e2e-servicenow' environment, and the reuse-workflows
      # docs are explicit that an environment secret of the same name is the
      # one used, because on.workflow_call does not support the environment
      # keyword and a caller therefore cannot supply these through it. The
      # human setup step is to add secrets named exactly instance, username
      # and password to the 'e2e-servicenow' environment.
      #
      # They stay declared, and 'required' drops to false, so a caller that
      # still passes them keeps validating and a caller that has already
      # moved to the environment is not forced to keep supplying secrets.
      # Leaving 'required: true' would be a break in all but name. AUDIT.md
      # rec #5 owns the removal, with the rest of the public API.
      #
      # An earlier commit on this branch also declared SN_INSTANCE,
      # SN_USERNAME and SN_PASSWORD here. That was a bypass: it let a caller
      # supply a value for a secret the environment is meant to own, under a
      # name nothing else reads. It is gone.
      instance:
        description: "Superseded: set an 'instance' secret on the 'e2e-servicenow' environment, which takes precedence"
        required: false
      username:
        description: "Superseded: set a 'username' secret on the 'e2e-servicenow' environment, which takes precedence"
        required: false
      password:
        description: "Superseded: set a 'password' secret on the 'e2e-servicenow' environment, which takes precedence"
        required: false

permissions: {}

jobs:
  # A workflow_call cannot police its own trigger, so the callee has to. This
  # job exists to turn an unapproved event into a failed run rather than a
  # skipped one: a skip is indistinguishable from a pass to a required status
  # check, which is the same bug class as the credential exposure below.
  #
  # github.event_name keeps the *caller's* event across the call boundary, so
  # a consumer wiring this to pull_request is caught as 'pull_request' here.
  guard:
    name: E2E Trust Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check trigger event
        id: check
        # Via env, not inline ${{ }}: the expansion happens before the script
        # reaches disk, so an interpolated value could splice in commands.
        # Same reasoning as the env-vars step in reusable-test-go.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            # schedule is what the summary below is written for.
            # workflow_dispatch is a human with write access asking for a
            # re-run, which is the same trust decision as a cron entry.
            schedule|workflow_dispatch)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              ;;
            # push is refused deliberately, not overlooked: a merged pull
            # request reaches this suite through 'schedule' within the hour
            # anyway, so allowlisting 'push' would only widen the window in
            # which any commit landing on the default branch compiles and runs
            # with the credentials.
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::error::reusable-e2e-go.yml refused the '$EVENT_NAME' event. It checks out the calling ref and runs that code against a live ServiceNow instance with production credentials, so it accepts only 'schedule' and 'workflow_dispatch'."
              exit 1
              ;;
          esac

  e2e:
    name: Live Instance Tests
    needs: guard
    # Belt and braces. 'needs' already skips this job when the guard fails;
    # the explicit condition also holds the line if the guard is ever made
    # non-fatal, which is the one edit that would reopen this hole.
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # This line is only a gate once a human has created the 'e2e-servicenow'
    # environment and given it required reviewers. GitHub creates a bare
    # environment with no reviewers on first reference, so without that
    # settings change this reads as protected and protects nothing. The manual
    # steps are in the pull request that introduced this line.
    environment: e2e-servicenow
    steps:
      # Fail before spending the 45-minute budget on a suite that cannot
      # authenticate. go test against an unreachable or unauthenticated
      # instance can skip rather than error, and a nightly that skips to
      # green is worse than one that fails: it reads as coverage.
      #
      # Step-scoped, like the step below, so nothing widens back to job
      # scope. check-secret observes presence only; the follow-up step
      # re-reads the same three values at the same scope to name which ones
      # are missing, because check-secret emits a ::warning:: for only the
      # first and always exits 0.
      - name: Check ServiceNow credentials are present
        id: credentials
        uses: $/.github/actions/check-secret
        env:
          SN_INSTANCE: ${{ secrets.instance }}
          SN_USERNAME: ${{ secrets.username }}
          SN_PASSWORD: ${{ secrets.password }}
        with:
          secret-names: "SN_INSTANCE,SN_USERNAME,SN_PASSWORD"

      - name: Fail on missing credentials
        if: steps.credentials.outputs.has-secrets != 'true'
        env:
          SN_INSTANCE: ${{ secrets.instance }}
          SN_USERNAME: ${{ secrets.username }}
          SN_PASSWORD: ${{ secrets.password }}
        run: |
          set -euo pipefail
          missing=""
          for name in SN_INSTANCE SN_USERNAME SN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="${missing:+$missing, }$name"
            fi
          done
          echo "::error::reusable-e2e-go.yml has no usable ServiceNow credentials: unset -- $missing."
          {
            echo "### E2E blocked: no ServiceNow credentials"
            echo ""
            echo "Unset: \`$missing\`"
            echo ""
            echo "They come from the 'e2e-servicenow' environment, as secrets"
            echo "named instance, username and password. If that environment"
            echo "does not exist yet this run is un-gated, not empty, and the"
            echo "suite would have tested nothing while reporting success."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-go-env
        with:
          go-version: ${{ inputs.go-version }}
          cache: "true"
          checkout: "false"

      - name: Run E2E suites
        working-directory: ${{ inputs.working-directory }}
        # Step scope, not job scope. Every process this step spawns inherits
        # these, and the code it compiles is the code in the checked-out tree.
        # The other steps only observe presence and read e2e-output.txt;
        # none of them has a use for the values themselves.
        # GO_TEST_TIMEOUT is not a secret but moves down too, so that no
        # job-scope env map is left for a secret to be added back to by
        # inertia.
        env:
          BUILD_FLAGS: ${{ inputs.build-flags }}
          GO_TEST_TIMEOUT: ${{ inputs.test-timeout }}
          SN_INSTANCE: ${{ secrets.instance }}
          SN_USERNAME: ${{ secrets.username }}
          SN_PASSWORD: ${{ secrets.password }}
        # pipefail is mandatory: without it the pipeline's exit code comes from
        # tee, and go test failures silently produce a green job.
        run: |
          set -o pipefail
          read -r -a BUILD_FLAGS_ARRAY <<< "$BUILD_FLAGS"
          go test "${BUILD_FLAGS_ARRAY[@]}" ./... -timeout "$GO_TEST_TIMEOUT" -v 2>&1 | tee e2e-output.txt

      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "### E2E Nightly failed"
            echo ""
            echo '```'
            grep -E "^(=== RUN|--- FAIL|FAIL|ok )" e2e-output.txt | tail -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-output
          path: ${{ inputs.working-directory }}/e2e-output.txt
          retention-days: 7
