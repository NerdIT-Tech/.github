name: Actionlint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

concurrency:
  group: actionlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: $/.github/workflows/reusable-actionlint/reusable-actionlint.yml
    permissions:
      contents: read  # the reusable's only need: checkout the workflows it lints
