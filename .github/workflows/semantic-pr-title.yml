name: Semantic PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: semantic-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/reusable-semantic-pr-title.yml
    permissions:
      contents: read
      pull-requests: write
      statuses: write
