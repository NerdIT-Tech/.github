name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  move-major-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move floating major version tag
        env:
          TAG: ${{ needs.release-please.outputs[format('{0}--tag_name', matrix.path)] }}
        run: |
          VERSION="${TAG##*/v}"
          COMPONENT="${TAG%/v"${VERSION}"}"
          MAJOR="${VERSION%%.*}"
          FLOAT_TAG="${COMPONENT}/v${MAJOR}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$FLOAT_TAG" "$TAG"
          git push origin "$FLOAT_TAG" --force
