name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's config only supports a single PR label, so the
      # `no-issue-required` title-lint exemption label is applied here instead.
      # Runs idempotently on every push.
      - name: Add no-issue-required label to release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t PR_NUMS < <(gh search prs --repo "$GITHUB_REPOSITORY" \
              --label 'autorelease: pending' --state open \
              --json number --jq '.[].number')
          for num in "${PR_NUMS[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${num}/labels" \
              -f labels[]=no-issue-required >/dev/null
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ steps.release.outputs.paths_released != '[]' }}
        with:
          # Credentials stay on purpose: the tag move below pushes to origin.
          fetch-depth: 0

      - name: Move floating major version tags
        if: ${{ steps.release.outputs.paths_released != '[]' }}
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mapfile -t RELEASED_PATHS < <(jq -r '.[]' <<<"$PATHS_RELEASED")
          for path in "${RELEASED_PATHS[@]}"; do
            key="${path}--tag_name"
            [ "$path" = "." ] && key="tag_name"
            TAG=$(jq -r --arg key "$key" '.[$key]' <<<"$RELEASE_OUTPUTS")
            VERSION="${TAG##*/v}"
            COMPONENT="${TAG%/v"${VERSION}"}"
            MAJOR="${VERSION%%.*}"
            FLOAT_TAG="${COMPONENT}/v${MAJOR}"
            git tag -f "$FLOAT_TAG" "$TAG"
            git push origin "$FLOAT_TAG" --force
          done
