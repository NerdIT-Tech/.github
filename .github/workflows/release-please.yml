name: release-please

on:
  push:
    branches:
      - main

permissions: {}

# release-please's release PRs and tag moves must not be interleaved: two
# concurrent runs would race on the same component tags. Cancelling is off
# because a half-finished release run leaves the repo mid-bump.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-latest
    # The only entrypoint workflow with a runs-on: job, and the only one
    # without a bound. Its concurrency group deliberately sets
    # cancel-in-progress: false, so a hang here holds the release lock for the
    # 360-minute default rather than being cancelled, and every later release
    # run queues behind it. 15 minutes is far above a normal release and well
    # below the lock-hold time it replaces.
    timeout-minutes: 15
    permissions:
      contents: write  # release-please opens the release commit, tag, and GitHub release
      pull-requests: write  # release-please opens the release PR and labels it
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's config only supports a single PR label, so the
      # `no-issue-required` title-lint exemption label is applied here instead.
      # Runs idempotently on every push.
      - name: Add no-issue-required label to release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t PR_NUMS < <(gh search prs --repo "$GITHUB_REPOSITORY" \
              --label 'autorelease: pending' --state open \
              --json number --jq '.[].number')
          for num in "${PR_NUMS[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${num}/labels" \
              -f labels[]=no-issue-required >/dev/null
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ steps.release.outputs.paths_released != '[]' }}
        with:
          fetch-depth: 0
          # The tag move below pushes, but it authenticates per-push with an
          # explicit extraheader instead of a credential left behind in
          # .git/config for every later step in the job to pick up.
          persist-credentials: false

      - name: Move floating major version tags
        if: ${{ steps.release.outputs.paths_released != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Authenticate the single push explicitly rather than leaving a
          # credential in .git/config (persist-credentials: false above).
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          mapfile -t RELEASED_PATHS < <(jq -r '.[]' <<<"$PATHS_RELEASED")
          for path in "${RELEASED_PATHS[@]}"; do
            key="${path}--tag_name"
            [ "$path" = "." ] && key="tag_name"
            TAG=$(jq -r --arg key "$key" '.[$key]' <<<"$RELEASE_OUTPUTS")
            VERSION="${TAG##*/v}"
            COMPONENT="${TAG%/v"${VERSION}"}"
            MAJOR="${VERSION%%.*}"
            FLOAT_TAG="${COMPONENT}/v${MAJOR}"
            git tag -f "$FLOAT_TAG" "$TAG"
            git push origin "$FLOAT_TAG" --force
          done
